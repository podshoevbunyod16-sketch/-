# ─────────────────────────────────────────────────────────────────────────────
# Публикация Docker-образов форка в GitHub Packages (ghcr.io/<владелец>/<репозиторий>).
# Собирает основные варианты образа для amd64 и arm64, затем склеивает их в
# multi-arch манифест. Публикация только в main/dev и по тегам v*; для pull request
# и ручного запуска с push=false образ только собирается.
# ─────────────────────────────────────────────────────────────────────────────
name: Docker images

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the images to ghcr.io'
        type: boolean
        default: true
      variants:
        description: 'Comma separated variants (main,slim,ollama,cuda)'
        type: string
        default: 'main,slim,ollama'
  push:
    branches:
      - main
      - dev
    tags:
      - v*

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  matrix:
    name: Resolve variants
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.pick.outputs.variants }}
    steps:
      - name: Pick the variants to build
        id: pick
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.variants }}"
          if [ -z "$requested" ]; then
            case "${{ github.ref }}" in
              refs/tags/v*) requested='main,slim,ollama,cuda' ;;
              *) requested='main,slim,ollama' ;;
            esac
          fi
          json=$(python3 - "$requested" <<'PY'
          import json, sys

          meta = {
              'main': {'suffix': '', 'build_args': '', 'free_disk': False},
              'slim': {'suffix': '-slim', 'build_args': 'USE_SLIM=true', 'free_disk': False},
              'ollama': {'suffix': '-ollama', 'build_args': 'USE_OLLAMA=true', 'free_disk': False},
              'cuda': {'suffix': '-cuda', 'build_args': 'USE_CUDA=true', 'free_disk': True},
          }

          names = [name.strip() for name in sys.argv[1].split(',') if name.strip()]
          unknown = [name for name in names if name not in meta]
          if unknown:
              raise SystemExit(f'unknown variant(s): {", ".join(unknown)}')

          print(json.dumps([{'name': name, **meta[name]} for name in names]))
          PY
          )
          echo "variants=$json" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.variant.name }} · ${{ matrix.platform.arch }}
    needs: [matrix]
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: linux/amd64
            runner: ubuntu-latest
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}

    steps:
      - name: Prepare environment
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform=${{ matrix.platform.arch }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/dev|refs/tags/v*) echo "PUSH=true" >> "$GITHUB_ENV" ;;
            *) echo "PUSH=false" >> "$GITHUB_ENV" ;;
          esac
          if [ -n "${{ github.event.inputs.push }}" ]; then
            echo "PUSH=${{ github.event.inputs.push }}" >> "$GITHUB_ENV"
          fi

      - name: Free disk space
        if: matrix.variant.free_disk
        run: sudo rm -rf /opt/hostedtoolcache /usr/share/dotnet || true

      - uses: actions/checkout@v5.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to the Container registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}
            suffix=${{ matrix.variant.suffix }},onlatest=true

      - name: Build (and push) the image
        id: build
        uses: docker/build-push-action@v5.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          platforms: ${{ matrix.platform.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
            ${{ matrix.variant.build_args }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ matrix.variant.name }}-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: digests-${{ matrix.variant.name }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest · ${{ matrix.variant.name }}
    needs: [matrix, build]
    if: ${{ !cancelled() && github.event.inputs.push != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}

    steps:
      - name: Prepare environment
        run: echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        continue-on-error: true
        uses: actions/download-artifact@v5.0.0
        with:
          pattern: digests-${{ matrix.variant.name }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Check digests
        id: check
        run: |
          count=$(find /tmp/digests -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -lt 2 ]; then
            echo "::warning::${{ matrix.variant.name }}: found $count digest(s); skipping the manifest merge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to the Container registry
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.check.outputs.skip != 'true'
        uses: docker/metadata-action@v5.10.0
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}
            suffix=${{ matrix.variant.suffix }},onlatest=true

      - name: Create and push the multi-arch manifest
        if: steps.check.outputs.skip != 'true'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect the image
        if: steps.check.outputs.skip != 'true'
        run: docker buildx imagetools inspect "${FULL_IMAGE_NAME}:${{ steps.meta.outputs.version }}"
