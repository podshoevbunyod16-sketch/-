version: 2
updates:
  # Фронтенд-зависимости (SvelteKit / Vite).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Бэкенд-зависимости, описанные в pyproject.toml (uv).
  - package-ecosystem: uv
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
