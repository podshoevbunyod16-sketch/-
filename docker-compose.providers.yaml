# Пример запуска образа, собранного в этом репозитории, с провайдерами,
# которые подставляются в настройки при первом запуске (см. .env.example).
#
#   docker compose -f docker-compose.providers.yaml up -d --build
#
services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-webui-fork:local
    container_name: open-webui-fork
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - '${OPEN_WEBUI_PORT-3000}:8080'
    environment:
      # Провайдеры, которые появятся в Настройки → Провайдеры при первом запуске.
      # Ключи API лучше передавать через .env / секреты, а не хранить в git.
      - PROVIDERS_JSON=${PROVIDERS_JSON-[]}
      - PROVIDERS_AUTO_APPLY=${PROVIDERS_AUTO_APPLY-true}
      # Классические переменные Open WebUI продолжают работать как раньше.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL-http://host.docker.internal:11434}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY-}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui-data:
